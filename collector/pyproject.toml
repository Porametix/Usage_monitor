[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-usage-monitor"
version = "0.1.0"
description = "Local Windows collector and USB Serial dashboard for AI usage"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "pydantic>=2.8,<3",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[project.scripts]
ai-usage-monitor = "ai_usage_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_usage_monitor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
